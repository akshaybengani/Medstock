name: medstock
description: "Medicine stock & refill logistics book"
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  intl: ^0.20.3
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  collection: ^1.19.1
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  file_picker: ^12.1.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# ---------------------------------------------------------------- branding
# Master art lives in assets/branding and is generated by tool/branding.py.
# Regenerate the platform sets with:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  image_path: "assets/branding/icon.png"

  android: true
  adaptive_icon_background: "#00696D"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_foreground.png"
  min_sdk_android: 24

  ios: true
  remove_alpha_ios: true

flutter_native_splash:
  # Light theme: the teal mark on the app's light surface.
  color: "#F4FAFA"
  image: "assets/branding/splash_light.png"
  # Dark theme: white mark on the dark surface.
  color_dark: "#0E1516"
  image_dark: "assets/branding/splash_dark.png"

  android_12:
    # Android 12+ draws its own splash: a centred icon on a solid colour.
    color: "#F4FAFA"
    image: "assets/branding/splash_light.png"
    icon_background_color: "#F4FAFA"
    color_dark: "#0E1516"
    image_dark: "assets/branding/splash_dark.png"
    icon_background_color_dark: "#0E1516"

  android: true
  ios: true
  web: false
